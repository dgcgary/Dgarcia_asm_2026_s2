[platformio]
default_envs = esp32
; Selecciona el modulo a compilar:
; - radar_serial   : salida en texto y barra ASCII para el Monitor Serial
; - radar_graficas : telemetria JSON para ver las ondas en test/diagnostico_radar.py
src_dir = radar_serial

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -O3
